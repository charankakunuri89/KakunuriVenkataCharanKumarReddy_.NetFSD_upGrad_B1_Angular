<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greeting Generator</title>
</head>
<body>
    <input type="text" id="data_input" placeholder="Enter your name"><br>
    <button onclick="handleGreeting()">Generate Greeting</button>
    <p id="greet"></p>
    <script>
        function handleGreeting() {
            let name = document.getElementById("data_input").value;
            generateGreeting(name);
        }
        function generateGreeting(input) {
            if (input === "") {
                alert("please enter input");
            }
            else {
                let msg = "Hello, " + input + "! Welcome to our website.";
                document.getElementById("greet").innerText = msg;
            } 
        }
        
    </script>
</body>
</html>
