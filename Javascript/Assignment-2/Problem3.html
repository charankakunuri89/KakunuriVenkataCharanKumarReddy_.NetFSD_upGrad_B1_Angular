<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App with Scope Control</title>
</head>
<body>
    <h2>Counter : <span id="display">0</span></h2>
    <input type="number" id="input" placeholder="Enter the step value">
    <button id= "incrementBtn">Increment</button>
    <button id="resetBtn">Reset</button>

    <script>
        // Global variable (outside functions)
        let counter = 0;

        // Function that accepts step as parameter
        function incrementCounter(step) {
            counter = counter + step;
            document.getElementById("display").innerText = counter;
        }

        // Reset function
        function resetCounter() {
            counter = 0;
            document.getElementById("display").innerText = counter;
        }

        // Adding event Listeners 
        document.getElementById("incrementBtn").addEventListener("click", function () {
            let step = Number(document.getElementById("input").value) || 1;
            incrementCounter(step);
        })

        document.getElementById("resetBtn").addEventListener("click", function () {
            resetCounter();
        })
    </script>
</body>
</html>
