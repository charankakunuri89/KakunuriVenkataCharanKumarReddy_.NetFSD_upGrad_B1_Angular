<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Analysis Tool</title>
</head>
<body>
    <script>
        let num = Number(prompt("Enter the number "))
        let Sign = (num >= 0) ? "Positive" : "Negative";
        console.log("Sign of given number is : " +Sign)
        if (num % 2 === 0) {
            console.log("Even")
        }
        else {
            console.log("odd")
        }

        for (let i = 1; i <= num; i++) {
            console.log(i);
        }
    </script>
</body>
</html>
