<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Evaluator</title>
</head>
<body>
    <script>
        let marks = Number(prompt("Enter student marks: "));

        // if (marks >= 75) console.log("Grade A");
        // else if (marks >= 60) console.log('Grade B');
        // else if (marks >= 40) console.log("Grade C");
        // else if (marks < 40) console.log("Fail");

         if (marks >= 75) document.write("Grade A");
        else if (marks >= 60) document.write('Grade B');
        else if (marks >= 40) document.write("Grade C");
        else document.write("Fail");
    </script>
</body>
</html>
