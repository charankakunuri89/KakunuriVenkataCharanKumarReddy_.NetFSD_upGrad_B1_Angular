<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location-Based Weather Logger</title>
</head>
<body onload="loadHistory()">
    <h2>Location-Based Weather Logger</h2>
    <button onclick="getLocation()">Get My Location</button>
    <div class="box">
        <h3>Current Location</h3>
        <p id="latitude">Latitude: --</p>
        <p id="longitude">Longitude: --</p>
        <p id="status">Status: Waiting...</p>
    </div>
    <div class="box">
        <h3>Location History (Last 5)</h3>
        <ul id="history"></ul>
    </div>
    <script>
        function getLocation() {
            const status = document.getElementById("status");

            if (!navigator.geolocation) {
                status.innerText = "Geolocation is not supported by this browser.";
                return;
            }
            status.innerText = "Fetching location..."
            navigator.geolocation.getCurrentPosition(
                showPosition,
                showError,
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        function showPosition(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            document.getElementById("latitude").innerText = "Latitude: " + lat;
            document.getElementById("longitude").innerText = "Longitude: " + lon;
            document.getElementById("status").innerText = "Location fetched successfully!";

            saveLocation(lat, lon);
            loadHistory();
        }

        function showError(error) {
            const status = document.getElementById("status");

            switch (error.code) {
                case error.PERMISSION_DENIED:
                    status.innerText = "Permission Denied by user.";
                    break;
                case error.POSITION_UNAVAILABLE:
                    status.innerText = "Location information unavailable.";
                    break;
                case error.TIMEOUT:
                    status.innerText = "Location request timed out.";
                    break;
                default:
                    status.innerText = "An unknown error occurred.";
            }
        }

     
        function saveLocation(lat, lon) {
            let locations = JSON.parse(localStorage.getItem("locationHistory")) || [];

            const newEntry = {
                latitude: lat,
                longitude: lon,
                time: new Date().toLocaleString()
            };

            locations.unshift(newEntry); 

            if (locations.length > 5) {
                locations = locations.slice(0, 5);
            }

            localStorage.setItem("locationHistory", JSON.stringify(locations));
        }

        function loadHistory() {
            const historyList = document.getElementById("history");
            historyList.innerHTML = "";

            const locations = JSON.parse(localStorage.getItem("locationHistory")) || [];

            if (locations.length === 0) {
                historyList.innerHTML = "<li>No location history found.</li>";
                return;
            }

            locations.forEach(loc => {
                const li = document.createElement("li");
                li.textContent = `Lat: ${loc.latitude}, Lon: ${loc.longitude} (${loc.time})`;
                historyList.appendChild(li);
            });
        }
    </script>
</body>
</html>
