<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Form Validation With Events</title>
</head>
<body>
    <form action="" onchange="fm">
        <label for="name">Name:</label>
        <input type="text" id="name"onchange="validateName()">
        <p id="nameMsg"></p>
        <br>
        <label for="email">Email:</label>
        <input type="email" id="email" onchange="validateEmail()">
        <p id="emailMsg"></p>
        <br>
        <label for="age">Age:</label>
        <input type="number" id="age" onchange="validateAge()">
        <p id="ageMsg"></p>
        <br>
        <button type="button" onclick="validateData()">Submit</button>
    </form>
    <h3 id="successMsg"></h3>
    <script>
        function validateName() {
            let name = document.getElementById("name").value;
            if (name.trim() === "") {
                document.getElementById("nameMsg").innerText = "Name cannot be empty";
                return false;
            }
            else {
                document.getElementById("nameMsg").innerText = "Valid Name";
                return true;
            }
        }

        function validateEmail() {
            let email = document.getElementById("email").value;
            if (email.includes("@")) {
                document.getElementById("emailMsg").innerText = "Valid Email";
                return true;
            }
            else {
                document.getElementById("emailMsg").innerText = "Email must contain @";
                return false;
            }
        }

        function validateAge() {
            let age = Number(document.getElementById("age").value);
            if (age > 18) {
                document.getElementById("ageMsg").innerText = "Valid age";
                return true;
            }
            else {
                document.getElementById("ageMsg").innerText = "Age must be greater than 18";
                return false;
            }
        }
        function validateData() {
            let isNameValid = validateName();
            let isEmailValid = validateEmail();
            let isAgeValid = validateAge();

            if (isAgeValid && isEmailValid && isNameValid) {
                let userData = {
                    name : document.getElementById("name").value,
                    email : document.getElementById("email").value,
                    age : document.getElementById("age").value
                };

                sessionStorage.setItem("user", JSON.stringify(userData));
                document.getElementById("successMsg").innerText = "Registration Successful! Data stored in sessionStorage.";
                return false;
            }
            else {
                document.getElementById("successMsg").innerText = "Please fix validation errors.";
                return false;
            }
        }
    </script>
</body>
</html>
